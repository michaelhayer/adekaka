<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>3D Camera Tracking - 22 Foto</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    background: #000;
    overflow: hidden;
    height: 100%;
    width: 100%;
    position: fixed;
    touch-action: none;
  }

  #scene {
    position: fixed;
    inset: 0;
    perspective: 900px;
    perspective-origin: 50% 50%;
    overflow: hidden;
    z-index: 10;
  }

  #world {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    transform-style: preserve-3d;
    will-change: transform;
  }

  .photo {
    position: absolute;
    width: 420px;
    height: 525px;
    margin-left: -210px;
    margin-top: -262px;
    border-radius: 10px;
    overflow: hidden;
    border: 4px solid rgba(0, 200, 255, 0.7);
    box-shadow:
      0 0 30px rgba(0, 200, 255, 0.6),
      0 0 70px rgba(0, 200, 255, 0.3);
    backface-visibility: hidden;
    background: #001a2e;
  }

  .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity 0.3s ease;
  }

  .photo::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      rgba(0,200,255,0.15),
      transparent 30%,
      transparent 70%,
      rgba(0,200,255,0.15));
    pointer-events: none;
  }

  .corridor {
    position: absolute;
    top: 50%;
    left: 50%;
    transform-style: preserve-3d;
    pointer-events: none;
  }

  .wall-line {
    position: absolute;
    background: rgba(0, 200, 255, 0.15);
    box-shadow: 0 0 10px rgba(0,200,255,0.3);
  }

  .floor-line {
    position: absolute;
    background: rgba(0, 200, 255, 0.2);
    height: 1px;
    width: 2000px;
    left: -1000px;
  }

  #vignette {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.9) 100%);
    pointer-events: none;
    z-index: 40;
  }

  #titleOverlay {
    position: fixed;
    top: 28px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    pointer-events: none;
    text-align: center;
    animation: titleFadeIn 1.5s ease-out forwards;
    opacity: 0;
    width: 100%;
    padding: 0 12px;
  }

  @keyframes titleFadeIn {
    from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  #titleOverlay .title-pill {
    display: inline-block;
    background: rgba(10, 25, 41, 0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 60px;
    padding: 14px 36px;
    box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.6),
                0 0 25px rgba(6, 182, 212, 0.25);
    max-width: 100%;
  }

  #titleOverlay h1 {
    font-family: 'Poppins', sans-serif;
    font-size: 1.6rem;
    font-weight: 900;
    letter-spacing: 3px;
    line-height: 1.2;
    margin: 0;
    white-space: nowrap;
  }

  .moving-gradient {
    background: linear-gradient(90deg, #ffffff, #a5f3fc, #ffffff, #34d399, #ffffff);
    background-size: 400% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientMove 6s linear infinite;
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.4), 0 4px 30px rgba(103, 232, 249, 0.5);
  }

  @keyframes gradientMove {
    0%   { background-position: 0% 50%; }
    100% { background-position: 400% 50%; }
  }

  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }

  #starfield {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 30% 20%, #0d1a2e 0%, transparent 50%),
      radial-gradient(ellipse at 70% 80%, #0a1520 0%, transparent 50%),
      radial-gradient(ellipse at bottom, #0a1520 0%, #000000 100%);
  }

  #starfield .stars-tiny,
  #starfield .stars-small,
  #starfield .stars-medium,
  #starfield .stars-big,
  #starfield .stars-color,
  #starfield .nebula {
    position: absolute;
    inset: -10%;
    width: 120%;
    height: 120%;
    transition: transform 0.15s ease-out;
    will-change: transform;
  }

  #starfield .stars-tiny {
    background-image:
      radial-gradient(1px 1px at 10px 20px, #ffffff, transparent),
      radial-gradient(1px 1px at 35px 55px, #ffffff, transparent),
      radial-gradient(1px 1px at 60px 15px, #ffffff, transparent),
      radial-gradient(1px 1px at 85px 75px, #ffffff, transparent),
      radial-gradient(1px 1px at 110px 35px, #ffffff, transparent),
      radial-gradient(1px 1px at 135px 95px, #ffffff, transparent),
      radial-gradient(1px 1px at 160px 45px, #ffffff, transparent),
      radial-gradient(1px 1px at 185px 25px, #ffffff, transparent),
      radial-gradient(1px 1px at 210px 65px, #ffffff, transparent),
      radial-gradient(1px 1px at 235px 105px, #ffffff, transparent),
      radial-gradient(1px 1px at 260px 30px, #ffffff, transparent),
      radial-gradient(1px 1px at 285px 70px, #ffffff, transparent),
      radial-gradient(1px 1px at 310px 40px, #ffffff, transparent),
      radial-gradient(1px 1px at 335px 85px, #ffffff, transparent),
      radial-gradient(1px 1px at 360px 55px, #ffffff, transparent),
      radial-gradient(1px 1px at 385px 115px, #ffffff, transparent),
      radial-gradient(1px 1px at 410px 20px, #ffffff, transparent),
      radial-gradient(1px 1px at 435px 75px, #ffffff, transparent),
      radial-gradient(1px 1px at 460px 50px, #ffffff, transparent),
      radial-gradient(1px 1px at 485px 90px, #ffffff, transparent),
      radial-gradient(1px 1px at 510px 15px, #ffffff, transparent),
      radial-gradient(1px 1px at 535px 105px, #ffffff, transparent);
    background-repeat: repeat;
    background-size: 560px 220px;
    animation: twinkleTiny 2.5s ease-in-out infinite alternate;
    opacity: 0.85;
  }

  #starfield .stars-small {
    background-image:
      radial-gradient(1.5px 1.5px at 20px 30px, #ffffff, transparent),
      radial-gradient(1.5px 1.5px at 90px 70px, #ffffff, transparent),
      radial-gradient(1.5px 1.5px at 160px 120px, #ffffff, transparent),
      radial-gradient(1.5px 1.5px at 230px 60px, #ffffff, transparent),
      radial-gradient(1.5px 1.5px at 300px 100px, #ffffff, transparent),
      radial-gradient(1.5px 1.5px at 370px 140px, #ffffff, transparent),
      radial-gradient(1.5px 1.5px at 440px 80px, #ffffff, transparent),
      radial-gradient(1.5px 1.5px at 510px 130px, #ffffff, transparent);
    background-repeat: repeat;
    background-size: 600px 300px;
    animation: twinkleSmall 3.5s ease-in-out infinite alternate;
    opacity: 0.9;
  }

  #starfield .stars-medium {
    background-image:
      radial-gradient(2px 2px at 100px 200px, #ffffff, transparent),
      radial-gradient(2px 2px at 250px 350px, #ffffff, transparent),
      radial-gradient(2px 2px at 400px 100px, #ffffff, transparent),
      radial-gradient(2px 2px at 550px 300px, #ffffff, transparent),
      radial-gradient(2px 2px at 700px 150px, #ffffff, transparent),
      radial-gradient(2px 2px at 850px 400px, #ffffff, transparent),
      radial-gradient(2px 2px at 200px 500px, #ffffff, transparent),
      radial-gradient(2px 2px at 600px 550px, #ffffff, transparent);
    background-repeat: repeat;
    background-size: 1100px 700px;
    animation: twinkleMedium 5s ease-in-out infinite alternate;
    opacity: 0.95;
    filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.8));
  }

  #starfield .stars-big {
    background-image:
      radial-gradient(3px 3px at 150px 100px, #ffffff, transparent),
      radial-gradient(3px 3px at 450px 250px, #ffffff, transparent),
      radial-gradient(3px 3px at 750px 400px, #ffffff, transparent),
      radial-gradient(3px 3px at 1050px 150px, #ffffff, transparent),
      radial-gradient(3px 3px at 300px 500px, #ffffff, transparent),
      radial-gradient(3px 3px at 900px 600px, #ffffff, transparent);
    background-repeat: repeat;
    background-size: 1400px 800px;
    animation: twinkleBig 4s ease-in-out infinite alternate, driftBig 120s linear infinite;
    opacity: 0.95;
    filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.9)) drop-shadow(0 0 12px rgba(165, 243, 252, 0.6));
  }

  #starfield .stars-color {
    background-image:
      radial-gradient(3.5px 3.5px at 180px 280px, #a5f3fc, transparent),
      radial-gradient(3.5px 3.5px at 480px 120px, #bae6fd, transparent),
      radial-gradient(3.5px 3.5px at 780px 480px, #a5f3fc, transparent),
      radial-gradient(3.5px 3.5px at 1100px 220px, #bae6fd, transparent),
      radial-gradient(3.5px 3.5px at 320px 600px, #a5f3fc, transparent),
      radial-gradient(3.5px 3.5px at 950px 700px, #bae6fd, transparent);
    background-repeat: repeat;
    background-size: 1500px 900px;
    animation: twinkleColor 6s ease-in-out infinite alternate, driftBig 200s linear infinite reverse;
    opacity: 1;
    filter: drop-shadow(0 0 8px rgba(165, 243, 252, 1)) drop-shadow(0 0 20px rgba(103, 232, 249, 0.7));
  }

  #starfield .nebula {
    background:
      radial-gradient(circle at 20% 30%, rgba(6, 182, 212, 0.12) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.10) 0%, transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.05) 0%, transparent 55%);
    animation: nebulaShift 18s ease-in-out infinite alternate;
  }

  @keyframes twinkleTiny { 0% { opacity: 0.5; } 100% { opacity: 1; } }
  @keyframes twinkleSmall { 0% { opacity: 0.6; } 100% { opacity: 1; } }
  @keyframes twinkleMedium { 0% { opacity: 0.55; } 100% { opacity: 1; } }
  @keyframes twinkleBig { 0% { opacity: 0.7; } 100% { opacity: 1; } }
  @keyframes twinkleColor { 0% { opacity: 0.75; } 50% { opacity: 1; } 100% { opacity: 0.75; } }
  @keyframes driftBig { 0% { transform: translate(0, 0); } 100% { transform: translate(-1400px, 0); } }
  @keyframes nebulaShift { 0% { opacity: 0.6; } 100% { opacity: 1; } }

  #lovefield {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }

  .love-particle {
    position: absolute;
    font-family: 'Poppins', 'Arial', sans-serif;
    font-weight: 600;
    white-space: nowrap;
    opacity: 0;
    text-shadow: 0 0 4px currentColor, 0 0 10px currentColor, 0 0 20px currentColor;
    will-change: opacity;
  }

  @keyframes loveAppear {
    from { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
    to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  @keyframes loveGlow {
    0% { opacity: 0.65; }
    100% { opacity: 1; }
  }

  .love-particle.fade-in {
    animation: loveAppear 1.5s ease-out forwards, loveGlow 3s ease-in-out infinite alternate 1.5s;
  }

  #musicBtn {
    position: fixed;
    bottom: 20px;
    left: 20px;
    z-index: 9999;
    width: 52px;
    height: 52px;
    padding: 0;
    border-radius: 50%;
    background: linear-gradient(135deg, #06b6d4, #10b981, #06b6d4);
    background-size: 200% 200%;
    border: 1.5px solid rgba(255, 255, 255, 0.5);
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 18px rgba(6, 182, 212, 0.6), 0 0 22px rgba(255, 255, 255, 0.3);
    transition: all 0.3s ease;
    animation: gradientShift 4s linear infinite, musicPulse 2s ease-in-out infinite;
    touch-action: manipulation;
  }
  #musicBtn:hover {
    transform: scale(1.12);
    box-shadow: 0 10px 24px rgba(6, 182, 212, 0.9), 0 0 35px rgba(255, 255, 255, 0.5);
  }
  #musicBtn:active { transform: scale(0.94); }

  @keyframes musicPulse {
    0%, 100% { box-shadow: 0 6px 18px rgba(6, 182, 212, 0.6), 0 0 22px rgba(255, 255, 255, 0.3); }
    50%      { box-shadow: 0 6px 18px rgba(6, 182, 212, 0.85), 0 0 35px rgba(255, 255, 255, 0.5); }
  }

  #musicBtn .music-icon {
    font-size: 1.15rem;
    line-height: 1;
    transition: opacity 0.3s;
  }

  #musicBtn .wave {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 3px;
    height: 18px;
    width: 20px;
    margin-left: 3px;
  }

  #musicBtn .wave .bar {
    width: 2.5px;
    border-radius: 2px;
    background: white;
    height: 4px;
    transition: height 0.2s;
    box-shadow: 0 0 4px rgba(255, 255, 255, 0.7);
    opacity: 0.7;
  }

  #musicBtn.playing .wave .bar {
    opacity: 1;
    animation: waveBar 0.9s ease-in-out infinite;
  }
  #musicBtn.playing .wave .bar:nth-child(1) { animation-delay: 0s; }
  #musicBtn.playing .wave .bar:nth-child(2) { animation-delay: 0.15s; }
  #musicBtn.playing .wave .bar:nth-child(3) { animation-delay: 0.3s; }
  #musicBtn.playing .wave .bar:nth-child(4) { animation-delay: 0.45s; }

  @keyframes waveBar {
    0%, 100% { height: 4px; }
    50%      { height: 16px; }
  }

  #musicBtn::after {
    content: attr(data-tip);
    position: absolute;
    left: 0;
    bottom: 62px;
    background: rgba(10, 25, 41, 0.95);
    color: #ffffff;
    padding: 5px 12px;
    border-radius: 18px;
    font-size: 0.72rem;
    font-weight: 600;
    white-space: nowrap;
    border: 1px solid rgba(255, 255, 255, 0.3);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  #musicBtn:hover::after { opacity: 1; }

  #replay {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 12px 24px;
    background: rgba(10, 25, 41, 0.75);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1.5px solid rgba(255, 255, 255, 0.4);
    color: #ffffff;
    font-size: 0.85rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    z-index: 100;
    border-radius: 40px;
    transition: all 0.3s;
    opacity: 0;
    pointer-events: none;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
  }

  #replay.show {
    opacity: 1;
    pointer-events: auto;
  }

  #replay:hover {
    background: linear-gradient(135deg, #06b6d4, #10b981);
    color: #000;
    box-shadow: 0 0 20px rgba(6, 182, 212, 0.8);
    transform: scale(1.05);
  }

  #loading {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 200;
    transition: opacity 0.8s ease;
    color: #0cf;
  }

  #loading.hide {
    opacity: 0;
    pointer-events: none;
  }

  .loader-ring {
    width: 70px;
    height: 70px;
    border: 3px solid rgba(0, 200, 255, 0.15);
    border-top-color: #0cf;
    border-right-color: #0cf;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 25px;
    box-shadow: 0 0 25px rgba(0,200,255,0.5);
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  #loading p {
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.8;
    font-family: 'Courier New', monospace;
  }

  #load-percent {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 15px;
    font-family: 'Courier New', monospace;
    text-shadow: 0 0 15px #0cf;
  }

  @media (max-width: 768px) {
    .photo {
      width: 320px;
      height: 400px;
      margin-left: -160px;
      margin-top: -200px;
      border-width: 3px;
    }
    #scene { perspective: 650px; }

    #titleOverlay { top: 18px; }
    #titleOverlay .title-pill { padding: 11px 26px; border-radius: 40px; }
    #titleOverlay h1 { font-size: 1.25rem; letter-spacing: 2px; }
  }

  @media (max-width: 480px) {
    .photo {
      width: 280px;
      height: 350px;
      margin-left: -140px;
      margin-top: -175px;
      border-width: 3px;
      border-radius: 10px;
    }
    #scene { perspective: 550px; }

    #titleOverlay { top: 14px; padding: 0 10px; }
    #titleOverlay .title-pill {
      padding: 9px 20px;
      border-radius: 30px;
    }
    #titleOverlay h1 {
      font-size: 1.05rem;
      letter-spacing: 1.5px;
      white-space: normal;
    }

    #musicBtn {
      width: 48px; height: 48px;
      bottom: 15px; left: 15px;
    }
    #musicBtn .music-icon { font-size: 1.05rem; }
    #replay {
      padding: 11px 20px;
      font-size: 0.78rem;
      bottom: 15px; right: 15px;
    }

    #loading p { font-size: 11px; letter-spacing: 3px; }
    #load-percent { font-size: 24px; }
    .loader-ring { width: 60px; height: 60px; }
  }

  @media (max-width: 360px) {
    .photo {
      width: 240px;
      height: 300px;
      margin-left: -120px;
      margin-top: -150px;
    }
    #titleOverlay h1 { font-size: 0.9rem; letter-spacing: 1px; }
    #titleOverlay .title-pill { padding: 8px 16px; }
  }

  @media (max-width: 900px) and (orientation: landscape) {
    .photo {
      width: 240px;
      height: 300px;
      margin-left: -120px;
      margin-top: -150px;
    }
    #scene { perspective: 550px; }
    #titleOverlay { top: 10px; }
    #titleOverlay h1 { font-size: 0.9rem; }
    #titleOverlay .title-pill { padding: 6px 16px; }
  }

  @supports (padding: env(safe-area-inset-bottom)) {
    #musicBtn { bottom: calc(20px + env(safe-area-inset-bottom)); }
    #replay { bottom: calc(20px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>

<div id="starfield">
  <div class="stars-tiny"></div>
  <div class="stars-small"></div>
  <div class="stars-medium"></div>
  <div class="stars-big"></div>
  <div class="stars-color"></div>
  <div class="nebula"></div>
</div>

<div id="lovefield"></div>

<div id="titleOverlay">
  <div class="title-pill">
    <h1 class="moving-gradient">✨ ADE KAKA BAKU SAYANG ✨</h1>
  </div>
</div>

<div id="scene">
  <div id="world"></div>
</div>

<div id="vignette"></div>

<button id="musicBtn" data-tip="Putar Musik" title="Putar Musik">
  <span class="music-icon">🎵</span>
  <span class="wave" aria-hidden="true">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </span>
</button>

<audio id="bgMusic" loop preload="auto">
  <source src="lomba-sihir.mp3" type="audio/mpeg">
</audio>

<button id="replay">↻ Replay</button>

<div id="loading">
  <div class="loader-ring"></div>
  <div id="load-percent">0%</div>
  <p>Memuat Foto</p>
</div>

<script>
(function() {
  'use strict';

  const TOTAL = 22;

  const isMobileDevice = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  const isSmallScreen = window.innerWidth <= 480;

  const CONFIG = {
    spacing: isSmallScreen ? 750 : 800,
    get totalDistance() { return this.spacing * TOTAL; },
    duration: 45000,
    cameraStartZ: 600,
    corridorHalfWidth: isSmallScreen ? 260 : 360,
    photoY: 0,
    photoAngle: isSmallScreen ? 25 : 30
  };

  const $ = id => document.getElementById(id);
  const scene = $('scene');
  const world = $('world');
  const loading = $('loading');
  const loadPercent = $('load-percent');
  const replayBtn = $('replay');

  const state = {
    photos: [],
    animationId: null,
    startTime: 0,
    isAnimating: false
  };

  // ===== SHUFFLE =====
  function shuffleArray(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ===== BUAT FOTO =====
  const photoNumbers = [];
  for (let i = 1; i <= TOTAL; i++) photoNumbers.push(i);

  for (let i = 0; i < TOTAL; i++) {
    const div = document.createElement('div');
    div.className = 'photo';

    const img = document.createElement('img');
    img.alt = `Foto ${i + 1}`;
    img.loading = 'eager';
    img.decoding = 'async';
    img.src = `kuara-${i + 1}.jpg`;

    div.appendChild(img);
    world.appendChild(div);

    const side = i % 2 === 0 ? -1 : 1;
    const z = -i * CONFIG.spacing;
    const x = side * CONFIG.corridorHalfWidth;
    const y = CONFIG.photoY;
    const rotY = side === -1 ? CONFIG.photoAngle : -CONFIG.photoAngle;

    state.photos.push({
      el: div,
      img: img,
      x, y, z, rotY
    });
  }

  state.photos.forEach(p => {
    p.el.style.transform =
      `translate3d(${p.x}px, ${p.y}px, ${p.z}px) rotateY(${p.rotY}deg)`;
    p.el.style.opacity = 1;
  });

  // ===== SHUFFLE FOTO =====
  // FIX: benar-benar acak setiap kali dipanggil (sebelumnya pakai array statis)
  function shufflePhotos() {
    const order = shuffleArray(photoNumbers);
    state.photos.forEach((p, i) => {
      const photoNum = order[i];
      const newSrc = `kuara-${photoNum}.jpg`;
      p.img.style.opacity = '0';
      setTimeout(() => {
        p.img.src = newSrc;
        p.img.style.opacity = '1';
      }, 150);
    });
  }

  // ===== PRELOAD =====
  // FIX: hindari "gantung" jika ada gambar gagal dimuat — tetap lanjut
  function preloadPhotos() {
    let loaded = 0;
    let finished = false;

    const finish = () => {
      if (finished) return;
      finished = true;
      loading.classList.add('hide');
      shufflePhotos();
      setTimeout(startAnimation, 400);
    };

    // Failsafe: kalau 8 detik belum selesai, paksa lanjut
    const failsafe = setTimeout(finish, 8000);

    for (let i = 1; i <= TOTAL; i++) {
      const img = new Image();
      const done = () => {
        loaded++;
        const pct = Math.round((loaded / TOTAL) * 100);
        loadPercent.textContent = pct + '%';
        if (loaded === TOTAL) {
          clearTimeout(failsafe);
          setTimeout(finish, 300);
        }
      };
      img.onload = done;
      img.onerror = done;
      img.src = `kuara-${i}.jpg`;
    }
  }

  // ===== GARIS LORONG =====
  const floorGroup = document.createElement('div');
  floorGroup.className = 'corridor';
  world.appendChild(floorGroup);

  const floorY = 200;
  const totalLines = TOTAL + 10;

  for (let i = 0; i < totalLines; i++) {
    const line = document.createElement('div');
    line.className = 'floor-line';
    line.style.top = floorY + 'px';
    line.style.transform = `translateZ(${-i * CONFIG.spacing}px)`;
    floorGroup.appendChild(line);
  }

  for (let i = 0; i < totalLines; i++) {
    const lineL = document.createElement('div');
    lineL.className = 'wall-line';
    lineL.style.width = '2px';
    lineL.style.height = '500px';
    lineL.style.left = -CONFIG.corridorHalfWidth + 'px';
    lineL.style.top = (-250 + floorY) + 'px';
    lineL.style.transform = `translateZ(${-i * CONFIG.spacing}px)`;
    floorGroup.appendChild(lineL);

    const lineR = document.createElement('div');
    lineR.className = 'wall-line';
    lineR.style.width = '2px';
    lineR.style.height = '500px';
    lineR.style.left = CONFIG.corridorHalfWidth + 'px';
    lineR.style.top = (-250 + floorY) + 'px';
    lineR.style.transform = `translateZ(${-i * CONFIG.spacing}px)`;
    floorGroup.appendChild(lineR);
  }

  // ===== ANIMASI =====
  // FIX: startTime di-reset hanya sekali di startAnimation, tidak di animate
  function animate(timestamp) {
    if (!state.startTime) state.startTime = timestamp;
    const elapsed = timestamp - state.startTime;
    const progress = Math.min(elapsed / CONFIG.duration, 1);

    const cameraZ = CONFIG.cameraStartZ + progress * (CONFIG.totalDistance + 1000);
    world.style.transform = `translateZ(${cameraZ}px)`;

    if (progress < 1) {
      state.animationId = requestAnimationFrame(animate);
    } else {
      state.isAnimating = false;
      replayBtn.classList.add('show');
    }
  }

  function startAnimation() {
    cancelAnimationFrame(state.animationId);
    replayBtn.classList.remove('show');
    state.startTime = 0;
    state.isAnimating = true;
    // FIX: langsung set posisi awal yang benar, jangan reset ke 0
    world.style.transform = `translateZ(${CONFIG.cameraStartZ}px)`;
    state.animationId = requestAnimationFrame(animate);
  }

  replayBtn.addEventListener('click', () => {
    if (!state.isAnimating) {
      shufflePhotos();
      setTimeout(startAnimation, 400);
    }
  });

  // =================================================================
  // 🎵 MUSIK
  // =================================================================
  const musicBtn = document.getElementById('musicBtn');
  const bgMusic = document.getElementById('bgMusic');
  const musicIcon = musicBtn.querySelector('.music-icon');
  let musicPlaying = false;

  // FIX: Gyro request dipindah ke interaksi user (klik musik) untuk iOS
  let gyroRequested = false;

  musicBtn.addEventListener('click', () => {
    if (musicPlaying) {
      bgMusic.pause();
      musicBtn.classList.remove('playing');
      musicIcon.textContent = '🔇';
      musicBtn.dataset.tip = 'Putar Musik';
      musicBtn.title = 'Putar Musik';
      musicPlaying = false;
    } else {
      bgMusic.play().then(() => {
        musicBtn.classList.add('playing');
        musicIcon.textContent = '🎵';
        musicBtn.dataset.tip = 'Matikan Musik';
        musicBtn.title = 'Matikan Musik';
        musicPlaying = true;
      }).catch(err => console.warn('Autoplay diblokir:', err));
    }

    // Minta izin gyro saat interaksi pertama (khusus iOS)
    if (!gyroRequested) {
      gyroRequested = true;
      enableGyro();
    }
  });

  // =================================================================
  // ✨ PARTIKEL LOVE YOU
  // =================================================================
  const lovefield = document.getElementById('lovefield');
  const WORDS = ['love you', 'Love You', 'LOVE YOU'];
  const COLORS = ['#ffffff', '#a5f3fc', '#bae6fd', '#e0f2fe', '#f0f9ff'];

  function heart_xy(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    return { x, y: -y };
  }

  function toScreen(x, y) {
    const W = window.innerWidth;
    const H = window.innerHeight;
    const scale = Math.min(W, H) / 24;
    return { sx: x * scale + W / 2, sy: y * scale + H / 2 };
  }

  function buildOutlineParticles(nOutline, minGap = 30) {
    const particles = [];
    const placed = [];
    for (let i = 0; i < nOutline; i++) {
      const t = (i / nOutline) * 2 * Math.PI;
      const { x, y } = heart_xy(t);
      const { sx, sy } = toScreen(x, y);
      let tooClose = false;
      for (const [px, py] of placed) {
        if (Math.hypot(sx - px, sy - py) < minGap) { tooClose = true; break; }
      }
      if (tooClose) continue;
      placed.push([sx, sy]);
      particles.push({ x: sx, y: sy, order: i });
    }
    return particles;
  }

  function buildFillParticles(nFill, minGap = 46) {
    const particles = [];
    const placed = [];
    let attempts = 0;
    const maxAttempts = nFill * 80;
    while (particles.length < nFill && attempts < maxAttempts) {
      attempts++;
      const t = Math.random() * 2 * Math.PI;
      const r = Math.random() * 0.86;
      const { x, y } = heart_xy(t);
      const { sx, sy } = toScreen(x * r, y * r);
      let tooClose = false;
      for (const [qx, qy] of placed) {
        if (Math.hypot(sx - qx, sy - qy) < minGap) { tooClose = true; break; }
      }
      if (tooClose) continue;
      placed.push([sx, sy]);
      particles.push({ x: sx, y: sy, order: Math.floor(Math.random() * 320) });
    }
    return particles;
  }

  function initLoveField() {
    lovefield.innerHTML = '';
    const isMob = window.innerWidth < 600;
    const nOutline = isMob ? 80 : 160;
    const nFill = isMob ? 65 : 130;

    const outline = buildOutlineParticles(nOutline);
    const fill = buildFillParticles(nFill);

    // FIX: fallback jika outline kosong
    const outlineSpan = outline.length
      ? Math.max(...outline.map(p => p.order))
      : 0;
    const framesPerStep = 1.6;
    const fillStartFrame = Math.floor(outlineSpan * framesPerStep) + 30;

    outline.forEach(p => { p.delay = p.order * framesPerStep; });
    fill.forEach(p => { p.delay = fillStartFrame + p.order; });

    const all = outline.concat(fill);
    const fontSize = isMob ? 9 : 13;
    const fragment = document.createDocumentFragment();

    all.forEach(p => {
      const el = document.createElement('div');
      el.className = 'love-particle';
      el.textContent = WORDS[Math.floor(Math.random() * WORDS.length)];
      el.style.left = p.x + 'px';
      el.style.top = p.y + 'px';
      el.style.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      el.style.fontSize = (fontSize * (0.85 + Math.random() * 0.3)) + 'px';
      el.style.animationDelay = (p.delay * 16) + 'ms';
      el.style.animationDuration = (2.5 + Math.random() * 2) + 's';
      el.classList.add('fade-in');
      fragment.appendChild(el);
    });

    lovefield.appendChild(fragment);
  }

  initLoveField();

  // FIX: resize listener dengan debounce & rebuild aman
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(initLoveField, 400);
  });

  // =================================================================
  // 📱 GYROSCOPE PARALLAX
  // =================================================================
  // FIX: cache elemen DOM, jangan querySelect tiap frame
  const parallaxLayers = [
    { el: document.querySelector('.stars-tiny'),   depth: 6  },
    { el: document.querySelector('.stars-small'),  depth: 10 },
    { el: document.querySelector('.stars-medium'), depth: 16 },
    { el: document.querySelector('.stars-big'),    depth: 24 },
    { el: document.querySelector('.stars-color'),  depth: 32 },
    { el: document.querySelector('.nebula'),       depth: 8  },
  ].filter(l => l.el);

  let targetBeta = 0;
  let targetGamma = 0;
  let currentBeta = 0;
  let currentGamma = 0;
  let gyroEnabled = false;

  function handleOrientation(e) {
    targetBeta  = e.beta  || 0;
    targetGamma = e.gamma || 0;
  }

  function handleMouseMove(e) {
    const W = window.innerWidth;
    const H = window.innerHeight;
    const mx = (e.clientX / W) * 2 - 1;
    const my = (e.clientY / H) * 2 - 1;
    targetGamma = mx * 30;
    targetBeta  = my * 30;
  }

  async function enableGyro() {
    if (gyroEnabled) return;
    if (typeof DeviceOrientationEvent === 'undefined') return;

    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      try {
        const perm = await DeviceOrientationEvent.requestPermission();
        if (perm === 'granted') {
          window.addEventListener('deviceorientation', handleOrientation, true);
          gyroEnabled = true;
        }
      } catch (err) {
        // fallback ke mouse
        window.addEventListener('mousemove', handleMouseMove);
      }
    } else {
      window.addEventListener('deviceorientation', handleOrientation, true);
      gyroEnabled = true;
    }
  }

  // Desktop / mouse fallback
  if (!isMobileDevice) {
    window.addEventListener('mousemove', handleMouseMove);
  }

  function animateParallax() {
    currentBeta  += (targetBeta  - currentBeta)  * 0.08;
    currentGamma += (targetGamma - currentGamma) * 0.08;

    const maxTilt = 35;
    const b = Math.max(-maxTilt, Math.min(maxTilt, currentBeta));
    const g = Math.max(-maxTilt, Math.min(maxTilt, currentGamma));

    for (let i = 0; i < parallaxLayers.length; i++) {
      const layer = parallaxLayers[i];
      const d = layer.depth;
      const tx = (-g / 90) * d;
      const ty = (-b / 90) * d;
      layer.el.style.transform = `translate3d(${tx}px, ${ty}px, 0)`;
    }

    requestAnimationFrame(animateParallax);
  }

  animateParallax();

  // ===== MULAI =====
  preloadPhotos();

})();
</script>
</body>
</html>
